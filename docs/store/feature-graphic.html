<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cosic — Play feature graphic 1024x500</title>
<!--
  Feature graphic, 1024 x 500. Key elements (tagline, UI card) stay in the central area; only the soft ring
  motif touches the edges. No icon lookalike, no device, no price/ranking/call-to-action wording.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Adwaita Sans", "Inter", "Liberation Sans", sans-serif; background: #333; }
  body.single section { display: none; }
  body.single section:target { display: block; }
  section {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background: linear-gradient(115deg, #8DF5D2 0%, #4DCDB0 55%, #27AE9A 100%);
  }
  .ring { position: absolute; width: 620px; height: 620px; opacity: .15; }
  .ring.a { left: -260px; bottom: -330px; }
  .ring.b { right: -230px; top: -330px; }
  .text { position: absolute; left: 90px; top: 140px; width: 400px; color: #0B1F1A; }
  .text h1 { font-size: 58px; line-height: 1.05; font-weight: 800; letter-spacing: -1.2px; }
  .text p { margin-top: 18px; font-size: 24px; line-height: 1.3; font-weight: 600; opacity: .8; }
  /* A crop of the first screenshot (raw rows 700-1290): the code and the piano roll, at 0.426 scale. */
  .card {
    position: absolute; left: 520px; top: 125px; width: 460px; height: 251px;
    border-radius: 24px; overflow: hidden; background: #0F1115;
    box-shadow: 0 18px 40px rgba(5,30,25,.38), 0 4px 12px rgba(5,30,25,.25);
  }
  .card img { position: absolute; left: 0; top: -298px; width: 460px; display: block; }
</style></head>
<body>
<script>if (location.hash) document.body.className = 'single';</script>
<section id="feature">
  <svg class="ring a" viewBox="0 0 108 108" aria-hidden="true"><g fill="#0B1F1A">
    <circle cx="54" cy="26" r="6"/><circle cx="73.8" cy="34.2" r="4"/><circle cx="82" cy="54" r="4"/><circle cx="73.8" cy="73.8" r="6"/>
    <circle cx="54" cy="82" r="4"/><circle cx="34.2" cy="73.8" r="4"/><circle cx="26" cy="54" r="6"/><circle cx="34.2" cy="34.2" r="4"/></g></svg>
  <svg class="ring b" viewBox="0 0 108 108" aria-hidden="true"><g fill="#0B1F1A">
    <circle cx="54" cy="26" r="6"/><circle cx="73.8" cy="34.2" r="4"/><circle cx="82" cy="54" r="4"/><circle cx="73.8" cy="73.8" r="6"/>
    <circle cx="54" cy="82" r="4"/><circle cx="34.2" cy="73.8" r="4"/><circle cx="26" cy="54" r="6"/><circle cx="34.2" cy="34.2" r="4"/></g></svg>
  <div class="text">
    <h1>Live-code<br>music</h1>
    <p>Patterns, sounds and visuals, written with your thumbs</p>
  </div>
  <div class="card"><img src="raw/01-editor-playing.png" alt="Code of a sketch playing, with the sounding steps outlined and a piano roll."></div>
</section>
</body></html>
